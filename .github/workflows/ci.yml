name: CI

# Corre la suite de tests (unitarios + BDD) en cada push y PR. No buildea la APK
# firmada: eso necesita el keystore (fuera del repo) y el toolchain de Android.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: Tests (pytest + pytest-bdd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # El core trae SQLAlchemy/reportlab/openpyxl/Pillow como dependencias.
          pip install -e ./vexa_core
          # Flet (UI, headless en los tests) + runners. Se fija la minor para no
          # romper ante cambios de API de Flet (el código es para la 0.86).
          pip install "flet~=0.86.0" "pytest>=8" "pytest-bdd>=8"

      - name: Correr los tests de mobile
        run: |
          cd mobile
          python -m pytest -q
